<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfwork Chiamate Asincrone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 text-center mb-4">Countdown</h1>

                        <label for="secondi" class="form-label">Secondi</label>
                        <input type="number" id="secondi" class="form-control form-control-lg" min="1" placeholder="Es. 10">

                        <p id="display" class="display-1 fw-bold text-center mt-4 mb-0">0</p>
                        <p id="messaggio" class="text-center text-body-secondary mb-4" aria-live="polite"></p>

                        <div class="d-flex gap-2">
                            <button type="button" id="btnAvvia" class="btn btn-success flex-fill">Avvia</button>
                            <button type="button" id="btnPausa" class="btn btn-warning flex-fill">Pausa</button>
                            <button type="button" id="btnAzzera" class="btn btn-danger flex-fill">Azzera</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
